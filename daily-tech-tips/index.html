<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          if (theme === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
          root.style.colorScheme = theme;
          root.style.backgroundColor = theme === "dark" ? "#07060b" : "#fafafa";
          root.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover daily tech tips, articles, and insights to improve your tech skills. Our blog offers a range of informative content, designed to keep you updated with the latest technology trends and practices." />
    <title>Daily Tech Tips: Enhance Your Tech Knowledge Daily | Daily Dose of Tech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/main.tsx"></script>
  </body>
</html>
